<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - Monde RPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header>
    <div class="container text-center bg-primary">
      <h2>Connexion au Monde RPG</h2>
    </div>
  </header>

  <main class="d-flex justify-content-center align-items-center" style="height:80vh;">
    <div class="card p-4" style="max-width:400px; width:100%;">
      <div class="card-header text-center">
        <i class="fa-solid fa-user-lock fa-2x"></i>
        <h4>Se connecter</h4>
      </div>
      <div class="card-body">
        <!-- Zone pour les messages d'erreur -->
        <div id="error-message" class="alert alert-danger" style="display:none;"></div>

        <form id="loginForm">
          <div class="form-group text-left">
            <label for="email">Adresse email</label>
            <input type="email" class="form-control" id="email" placeholder="Votre email" required>
          </div>
          <div class="form-group text-left">
            <label for="password">Mot de passe</label>
            <input type="password" class="form-control" id="password" placeholder="Votre mot de passe" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-3">
            <i class="fa-solid fa-right-to-bracket"></i> Connexion
          </button>
        </form>
      </div>
      <div class="card-footer text-center">
        <p>Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
      </div>
    </div>
  </main>

  <footer>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

    <script>
      async function login(email, motDePasse) {
        try {
          const response = await fetch("https://localhost:7061/api/Utilisateurs/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, motDePasse: motDePasse })
          });

          if (!response.ok) {
            const message = await response.text();
            throw new Error(message || "Erreur de connexion");
          }

          const utilisateur = await response.json();
          console.log("Connecté :", utilisateur);

          // Stockage local
          localStorage.setItem("utilisateur", JSON.stringify(utilisateur));

          // Rediriger vers la carte
          window.location.href = "index.html";

        } catch (err) {
          console.error("Erreur lors de la connexion:", err);
          const errorDiv = document.getElementById('error-message');
          errorDiv.textContent = err.message;
          errorDiv.style.display = "block";
        }
      }

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        login(email, password);
      });
    </script>
  </footer>
</body>
</html>
